image: node:22

stages:
  - test
  - build
  - deploy

variables:
  FF_USE_FASTZIP: 'true'
  TRANSFER_METER_FREQUENCY: '2s'

# cache: # TODO: кэш загружается в каждой джобе сейчас
#   key:
#     files:
#       - frontend/package-lock.json
#   paths:
#     - frontend/node_modules

.ssh_setup:
  before_script:
    - apk add --no-cache openssh rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo "HOST *" > ~/.ssh/config
    - echo "StrictHostKeyChecking no" >> ~/.ssh/config

# Test
backend_unit_test:
  stage: test
  script:
    - cd backend
    - npm ci
    - npm run test:unit

backend_integration_test:
  stage: test
  script:
    - cd backend
    - npm ci
    - npm run test:integration

frontend_test:
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm run test

# Build
frontend_build:
  stage: build
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week

# Deploy
frontend_deploy:
  image: alpine:3.21
  stage: deploy
  extends: .ssh_setup
  script:
    - rsync -avz frontend/dist/ root@$VPS_IP:/var/www/$VPS_IP/

backend_build_and_deploy:
  image: alpine:3.21
  stage: deploy
  extends: .ssh_setup
  script:
    - ssh root@$VPS_IP "mkdir -p ~/time-tracker &&
      cd ~/time-tracker && git pull --no-rebase &&
      cd backend/ && docker compose -f docker-compose.yml -f docker-compose.prod.yml build &&
      docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d"
    # --no-cache
